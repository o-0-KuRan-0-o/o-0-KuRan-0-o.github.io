
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ホームページ</title>
  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #242424;
      color: #4e4e4e;

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;
    }

    /* =========================
       ボックス全体の配置
    ========================= */

    .menu {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    /* =========================
       各ボックスの共通デザイン
    ========================= */

    .card {
      position: relative;

      aspect-ratio: 1 / 0.9;
      min-width: 0;

      border: 4px solid #4e4e4e;
      border-radius: 30px;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px;

      background-color: #242424;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;

      color: #fff;
      text-align: center;
      text-decoration: none;

      font-size: clamp(18px, 4.5vw, 30px);
      line-height: 1.5;
    }

    /* =========================
       クリック可能なボックス
       キャラクター一覧・お題箱のみ
    ========================= */

    a.card {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    a.card:hover {
      opacity: 0.8;
    }

    a.card:focus-visible {
      outline: 3px solid #505050;
      outline-offset: 4px;
    }

    /* =========================
       プロフィール
    ========================= */

    .profile {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;

      gap: 8px;
      padding: 10px;
    }

    /* 画像とニックネームを横並びにする */

    .profile-header {
      display: flex;
      align-items: center;
      gap: 8px;

      width: 100%;
      min-width: 0;
    }

    /* プロフィール画像 */

    .profile-image {
      flex: 0 0 40%;
      width: 40%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;

      border: 4px solid #4e4e4e;
      border-radius: 25px;
      background-color: #242424;
    }

    /* ニックネーム */
    .nickname {
      flex: 1;
      min-width: 0;

      font-size: clamp(19px, 6.0vw, 42px);
      font-weight: bold;
      text-align: center;

      overflow-wrap: anywhere;
    }

    /* プロフィール文 */
    .profile-text {
      width: 100%;
      margin-top: auto;
      margin-bottom: auto;

      font-size: clamp(13px, 3vw, 21px);
      line-height: 1.5;
      text-align: center;
    }

    /* リンクリスト */
    .link-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* リンクの見た目 */
    .link-list a {
      color: #fff;
      text-decoration: none;
    }

    /* マウスを乗せたとき */
    .link-list a:hover {
      color: #4e4e4e;
    }

    /* キャラクター一覧の背景動画 */
    .character-card {
      position: relative;
      isolation: isolate;
    }

    /* 動画をボックス全体に表示 */
    .character-card .card-video {
      position: absolute;
      inset: 0;
      z-index: -1;

      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    /* 文字を動画の上に表示 */
    .character-card .card-text {
      position: relative;
      z-index: 1;
    }

    /* 動画ボックス */
    .video {
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    /* 動画本体 */
    .video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    /* 更新記録ボックス */
    .updates {
      padding: 12px;
      align-items: stretch;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* ボックス内部をスクロール */
    .updates-content {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;

      text-align: left;
      font-size: 14px;
      line-height: 1.6;

      scrollbar-width: thin;
      scrollbar-color: #888888 transparent;
    }

    /* 各更新記録 */
    .updates-content p {
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    /* =========================
       スマートフォン対応
    ========================= */

    @media (max-width: 380px) {
      body {
        padding: 12px;
      }

      .menu {
        gap: 10px;
      }

      .card {
        border-width: 3px;
        border-radius: 22px;
        padding: 6px;
      }

      .profile {
        padding: 6px;
        gap: 6px;
      }

      .profile-image {
        border-width: 3px;
        border-radius: 18px;
      }

      .profile-header {
        gap: 5px;
      }

      .nickname {
        font-size: 17px;
      }

      .profile-text {
        font-size: 12px;
      }
    }
  </style>
</head>
