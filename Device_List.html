
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>デバイス一覧</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    color: #000000;
    font-family: sans-serif;
}

/* 全体 */
.container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

/* タイトル */
.page-title {
    width: 100%;
    height: 115px;
    border: 3px solid #000;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000000;
    color: #ffffff;

    font-size: 56px;
    font-weight: bold;
    margin-bottom: 16px;
}

/* デバイス一覧 */
.device-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 5px;
}

/* 各画像リンク */
.device-item {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;

    border: 3px solid #000;
    border-radius: 12px;

    overflow: hidden;
    text-decoration: none;

    transition: opacity 0.2s;
}

/* 画像 */
.device-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* マウスを乗せたとき */
.device-item:hover {
    opacity: 0.7;
}

/* TOPボタン */
.top-button {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 225px;
    height: 100px;

    margin: 35px auto 0;

    border: 3px solid #000;
    border-radius: 12px;

    background: #000000;
    color: #ffffff;
    text-decoration: none;
    font-size: 65px;

    transition: background 0.2s;
}

.top-button:hover {
    background: #494949;
}

/* スマートフォン */
@media screen and (max-width: 600px) {

    body {
        padding: 10px;
    }

    .page-title {
        height: 75px;
        font-size: 32px;
    }

    .device-list {
        gap: 8px;
        padding: 0 2px;
    }

    .device-item {
        border-width: 2px;
        border-radius: 8px;
    }

    .top-button {
        width: 150px;
        height: 70px;
        font-size: 45px;
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- タイトル -->
    <div class="page-title">
        デバイス一覧
    </div>

    <!-- デバイス一覧 -->
    <div class="device-list">

        <!-- デバイス1 -->
        <a href="https://k-u-r-a-n.booth.pm/items/8933300" class="device-item">
            <img src="images/Page_Device_List/Device001.jpg" alt="VorteX">
        </a>

        <!-- デバイス2 -->
        <a href="Page_Device_List/Device002/Device002.html" class="device-item">
            <img src="images/Page_Device_List/Device002.jpg" alt="VorteX2">
        </a>

        <!-- デバイス3 -->
        <a href="device003.html" class="device-item">
            <img src="images/Page_Device_List/Device_Blank.jpg" alt="デバイス3">
        </a>

        <!-- デバイス4 -->
        <a href="Page_Device_List/Distribute.html" class="device-item">
            <img src="images/Page_Device_List/Device004.jpg" alt="デバイス4">
        </a>

    </div>

    <!-- TOPボタン -->
    <a href="index.html" class="top-button">
        TOP
    </a>

</div>

</body>
</html>
