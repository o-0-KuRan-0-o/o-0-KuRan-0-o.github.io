<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 32px 4% 45px;
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
}

/* 画像一覧 */
.image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 26px;
}

/* 画像ボタン */
.image-item {
    display: block;
    width: 100%;
    aspect-ratio: 1.08 / 1;
    border: 2px solid #fff;
    border-radius: 10px;
    overflow: hidden;
    transition: opacity 0.2s;
}

.image-item:hover {
    opacity: 0.7;
}

/* 画像 */
.image-item img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/* 戻るボタン */
.back-area {
    display: flex;
    justify-content: center;
    margin-top: 32px;
}

.back-button {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 236px;
    height: 110px;
    border: 2px solid #fff;
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 48px;
    transition: opacity 0.2s;
}

.back-button:hover {
    opacity: 0.7;
}

/* スマートフォン */
@media screen and (max-width: 600px) {
    body {
        padding: 20px 4% 30px;
    }

    .image-grid {
        gap: 12px;
    }

    .image-item {
        border-radius: 7px;
    }

    .back-area {
        margin-top: 24px;
    }

    .back-button {
        width: 120px;
        height: 58px;
        font-size: 26px;
    }
}
</style>
</head>
